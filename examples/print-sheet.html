<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>UPC-A label sheet — Avery 5160</title>
<style>
  @page { size: letter; margin: 0; }
  body { margin: 0; font: 10px/1.2 Helvetica, Arial, sans-serif; }
  .sheet { width: 8.5in; padding-top: 0.5in; padding-left: 0.19in; }
  .grid { display: grid; grid-template-columns: repeat(3, 2.625in); gap: 0; }
  .label { width: 2.625in; height: 1in; display: flex; flex-direction: column;
           align-items: center; justify-content: center; overflow: hidden; }
  .label svg { height: 0.72in; width: auto; }
  .label .name { font-size: 7px; text-transform: uppercase; letter-spacing: .04em; }
  @media print { .hint { display: none; } }
  .hint { padding: 8px; background: #fffbe6; border-bottom: 1px solid #e8d98a; }
</style>

<p class="hint">
  Print at <strong>100%</strong>, not “Fit to page”. For Avery 5160, 30 per sheet
  (3 × 10) on US Letter. Hold the first sheet against the real stock before peeling.
</p>

<div class="sheet"><div class="grid" id="grid"></div></div>

<script src="../upc-a.js"></script>
<script>
  // Edit these two lines; everything else lays itself out.
  var NUMBERS = ["03600029145"];
  var NAME = "Sample product";

  var grid = document.getElementById("grid");
  var total = 30;                       // Avery 5160
  var n = 0;
  while (grid.children.length < total) {
    var digits = NUMBERS[n % NUMBERS.length];
    var cell = document.createElement("div");
    cell.className = "label";
    cell.innerHTML = UPCA.svg(digits, { showText: true, scale: 0.55 });
    if (NAME) {
      var cap = document.createElement("div");
      cap.className = "name";
      cap.textContent = NAME;
      cell.appendChild(cap);
    }
    grid.appendChild(cell);
    n++;
  }
</script>
</html>
